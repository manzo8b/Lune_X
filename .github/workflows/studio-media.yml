name: Lune_X private media production
on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'Verify the private render bridge without claiming work or calling models'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '3-58/5 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: lunex-private-media
  cancel-in-progress: false
jobs:
  render:
    if: github.repository == 'manzo8b/Lune_X' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/lunex-media
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned renderer dependencies
        working-directory: .github/lunex-media
        run: npm ci --ignore-scripts
      - name: Verify free standard runner and media tools
        if: github.event.inputs.diagnostic != 'true'
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Produce at most one approved media package
        working-directory: .github/lunex-media
        env:
          LUNEX_DIAGNOSTIC: ${{ github.event.inputs.diagnostic || 'false' }}
        run: node run.mjs
      # Private files, captions and signed URLs are never uploaded as Actions artifacts.
