name: Lune_X — Optimize original template logo
on:
  workflow_dispatch:
  push:
    branches: [redesign-v2]
    paths:
      - '.github/scripts/optimize-reference-artwork.mjs'
      - '.github/workflows/optimize-reference-artwork.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image encoder
        run: npm install --no-save --no-package-lock sharp
      - name: Optimize reference artwork without changing its design
        run: node .github/scripts/optimize-reference-artwork.mjs
      - name: Commit cached local WebP images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/lunex-reference-*.webp assets/css/lunex-v2.css
          if ! git diff --cached --quiet; then
            git commit -m "perf: extract original logo into locally cached WebP assets"
            git push origin HEAD:redesign-v2
          fi
