name: Lune_X — Self-host open-source brand fonts
on:
  workflow_dispatch:
  push:
    branches: [redesign-v2]
    paths:
      - '.github/scripts/selfhost-fonts.mjs'
      - '.github/workflows/selfhost-fonts.yml'
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download licensed WOFF2 once at build time
        run: node .github/scripts/selfhost-fonts.mjs
      - name: Commit local font assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts assets/css/brand-fonts.css
          if ! git diff --cached --quiet; then
            git commit -m "assets: self-host Bricolage Grotesque and Instrument Sans WOFF2"
            git push origin HEAD:redesign-v2
          fi
